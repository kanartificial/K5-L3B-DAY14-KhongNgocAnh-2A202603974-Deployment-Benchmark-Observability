<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Production AI Agent — Demo UI</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #0b1220;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --ok: #22c55e;
      --warn: #f59e0b;
      --err: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 12px;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }
    .dot.ok { background: var(--ok); }
    .dot.err { background: var(--err); }
    .dot.warn { background: var(--warn); }

    .config-bar {
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }
    .config-bar label { color: var(--muted); font-weight: 500; }
    .config-bar input {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 13px;
      min-width: 240px;
      outline: none;
    }
    .config-bar input:focus { border-color: var(--accent); }
    .btn {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover { border-color: var(--accent); }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #0f172a;
      font-weight: 600;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      max-width: 880px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .empty-state {
      text-align: center;
      margin: auto;
      color: var(--muted);
      max-width: 560px;
    }
    .empty-state h2 {
      color: var(--text);
      font-size: 20px;
      margin-bottom: 8px;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
    }
    .chip {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
    }
    .chip:hover { border-color: var(--accent); color: var(--accent); }

    .msg {
      max-width: 82%;
      padding: 12px 15px;
      border-radius: 14px;
      line-height: 1.55;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #0284c7;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--panel);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .msg.error {
      align-self: flex-start;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid var(--err);
      color: #fecaca;
    }
    .meta {
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid rgba(148, 163, 184, 0.2);
      font-size: 11px;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    footer {
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 12px 20px;
    }
    .composer {
      max-width: 880px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
    }
    .composer textarea {
      flex: 1;
      resize: none;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      min-height: 44px;
      max-height: 140px;
      outline: none;
    }
    .composer textarea:focus { border-color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>🤖 Production AI Agent</h1>
    </div>
    <div class="badges">
      <span class="badge" id="badge-health"><span class="dot"></span>/health: ...</span>
      <span class="badge" id="badge-ready"><span class="dot"></span>/ready: ...</span>
      <span class="badge" id="badge-mode"><span class="dot"></span>LLM: ...</span>
    </div>
  </header>

  <div class="config-bar">
    <label for="apiKey">X-API-Key:</label>
    <input id="apiKey" type="password" placeholder="Nhập AGENT_API_KEY của bạn..." autocomplete="off" />
    <button class="btn" id="toggleKey" type="button">Hiện</button>
    <button class="btn" id="refreshStatus" type="button">Kiểm tra Health / Ready</button>
    <button class="btn" id="clearChat" type="button">Xóa chat</button>
  </div>

  <main id="chat">
    <div class="empty-state" id="emptyState">
      <h2>Demo AI Agent trên Production</h2>
      <p>Nhập <code>AGENT_API_KEY</code> ở thanh trên rồi đặt câu hỏi để kiểm thử trực tiếp Authentication, Rate Limiting, Cost Guard và AI API.</p>
      <div class="chips">
        <button class="chip" type="button">Giải thích Docker multi-stage build ngắn gọn</button>
        <button class="chip" type="button">Liveness (/health) và Readiness (/ready) khác nhau gì?</button>
        <button class="chip" type="button">Tại sao cần Redis cho Rate Limiting trên production?</button>
      </div>
    </div>
  </main>

  <footer>
    <form class="composer" id="form">
      <textarea id="question" rows="1" placeholder="Nhập câu hỏi... (Enter để gửi, Shift+Enter xuống dòng)"></textarea>
      <button class="btn btn-primary" id="sendBtn" type="submit">Gửi</button>
    </form>
  </footer>

  <script>
    const chatEl = document.getElementById("chat");
    const emptyEl = document.getElementById("emptyState");
    const apiKeyInput = document.getElementById("apiKey");
    const questionInput = document.getElementById("question");
    const sendBtn = document.getElementById("sendBtn");

    apiKeyInput.value = sessionStorage.getItem("agent_api_key") || "";
    apiKeyInput.addEventListener("input", () => {
      sessionStorage.setItem("agent_api_key", apiKeyInput.value.trim());
    });

    document.getElementById("toggleKey").addEventListener("click", (e) => {
      const isPass = apiKeyInput.type === "password";
      apiKeyInput.type = isPass ? "text" : "password";
      e.target.textContent = isPass ? "Ẩn" : "Hiện";
    });

    document.getElementById("clearChat").addEventListener("click", () => {
      chatEl.innerHTML = "";
      chatEl.appendChild(emptyEl);
      emptyEl.style.display = "block";
    });

    document.querySelectorAll(".chip").forEach((btn) => {
      btn.addEventListener("click", () => {
        questionInput.value = btn.textContent;
        questionInput.focus();
      });
    });

    function setBadge(id, text, state) {
      const el = document.getElementById(id);
      el.innerHTML = `<span class="dot ${state}"></span>${text}`;
    }

    async function checkStatus() {
      try {
        const hRes = await fetch("/health");
        if (hRes.ok) {
          const h = await hRes.json();
          setBadge("badge-health", `/health: 200 (${h.environment})`, "ok");
          const isLive = h.llm_mode === "live";
          setBadge(
            "badge-mode",
            `LLM: ${isLive ? "LIVE" : "MOCK"} (${h.model || "unknown"})`,
            isLive ? "ok" : "warn"
          );
        } else {
          setBadge("badge-health", `/health: ${hRes.status}`, "err");
        }
      } catch {
        setBadge("badge-health", "/health: offline", "err");
      }

      try {
        const rRes = await fetch("/ready");
        setBadge(
          "badge-ready",
          rRes.ok ? "/ready: 200 (Redis OK)" : `/ready: ${rRes.status}`,
          rRes.ok ? "ok" : "err"
        );
      } catch {
        setBadge("badge-ready", "/ready: offline", "err");
      }
    }

    document.getElementById("refreshStatus").addEventListener("click", checkStatus);
    checkStatus();

    function appendMessage(role, text, metaText = "") {
      if (emptyEl.parentNode) emptyEl.style.display = "none";
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      if (metaText) {
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = metaText;
        div.appendChild(meta);
      }
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
      return div;
    }

    async function sendQuestion() {
      const q = questionInput.value.trim();
      if (!q) return;

      const key = apiKeyInput.value.trim();
      appendMessage("user", q);
      questionInput.value = "";
      sendBtn.disabled = true;

      const thinking = appendMessage("assistant", "Đang suy nghĩ...");
      const t0 = performance.now();

      try {
        const headers = { "Content-Type": "application/json" };
        if (key) headers["X-API-Key"] = key;

        const res = await fetch("/ask", {
          method: "POST",
          headers,
          body: JSON.stringify({ question: q, user_id: "web-demo" }),
        });
        const elapsed = Math.round(performance.now() - t0);
        const data = await res.json().catch(() => ({}));
        thinking.remove();

        if (!res.ok) {
          const hint =
            res.status === 401 ? "Thiếu hoặc sai X-API-Key" :
            res.status === 429 ? `Vượt Rate Limit (Retry-After: ${res.headers.get("Retry-After") || "60"}s)` :
            res.status === 402 ? "Vượt ngân sách (Cost Guard)" :
            `Lỗi HTTP ${res.status}`;
          appendMessage("error", `${hint}\n${data.detail || ""}`.trim(), `HTTP ${res.status} · ${elapsed} ms`);
          return;
        }

        const u = data.usage || {};
        const meta = [
          `provider: ${data.provider || "mock"}`,
          `model: ${data.model || "mock-llm"}`,
          `tokens: ${u.input_tokens ?? "?"} in / ${u.output_tokens ?? "?"} out`,
          `cost: $${u.cost_usd ?? 0}`,
          `${elapsed} ms`,
        ].join("  ·  ");
        appendMessage("assistant", data.answer || "(empty response)", meta);
      } catch (err) {
        thinking.remove();
        appendMessage("error", `Không thể kết nối server: ${err.message}`);
      } finally {
        sendBtn.disabled = false;
        questionInput.focus();
      }
    }

    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      sendQuestion();
    });

    questionInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendQuestion();
      }
    });
  </script>
</body>
</html>
